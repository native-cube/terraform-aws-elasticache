name: Terraform Checks

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  push:
    branches:
      - main
    tags:
      - "[0-9]*.[0-9]*.[0-9]*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Formatting, docs, and lint
    runs-on: ubuntu-latest

    steps:
      - name: Validate release tag
        if: github.ref_type == 'tag'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "${RELEASE_TAG}" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "Release tag must be unprefixed Semantic Versioning, for example 1.2.3 or 1.2.3-rc.1" >&2
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: 1.16.0
          terraform_wrapper: false

      - name: Install terraform-docs
        env:
          TERRAFORM_DOCS_VERSION: 0.24.0
        run: |
          curl -sSLo /tmp/terraform-docs.tar.gz "https://github.com/terraform-docs/terraform-docs/releases/download/v${TERRAFORM_DOCS_VERSION}/terraform-docs-v${TERRAFORM_DOCS_VERSION}-linux-amd64.tar.gz"
          tar -xzf /tmp/terraform-docs.tar.gz -C /tmp terraform-docs
          sudo install -m 0755 /tmp/terraform-docs /usr/local/bin/terraform-docs

      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
        run: |
          curl -sSLo /tmp/actionlint.tar.gz "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
          sudo install -m 0755 /tmp/actionlint /usr/local/bin/actionlint

      - name: Terraform fmt
        run: terraform fmt -check -recursive

      - name: Check generated docs
        run: scripts/terraform-docs.sh --check

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v6.3.2
        with:
          tflint_version: v0.64.0
          cache: true

      - name: Initialize TFLint plugins
        run: tflint --init
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Run TFLint
        run: tflint --recursive --format compact --config "${GITHUB_WORKSPACE}/.tflint.hcl"

      - name: Lint GitHub Actions workflows
        run: actionlint

      - name: Lint shell scripts
        run: shellcheck scripts/*.sh .githooks/pre-commit

  compatibility:
    name: Terraform ${{ matrix.terraform }} / AWS provider ${{ matrix.provider }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - terraform: 1.11.4
            provider: 6.62.0
            run_tests: true
          - terraform: 1.16.0
            provider: latest-v6
            run_tests: true

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: ${{ matrix.terraform }}
          terraform_wrapper: false

      - name: Remove dependency locks for compatibility resolution
        run: find . -name .terraform.lock.hcl -delete

      - name: Pin minimum AWS provider
        if: matrix.provider == '6.62.0'
        run: sed -i 's/>= 6\.62\.0, < 7\.0\.0/= 6.62.0/' versions.tf

      - name: Terraform init
        run: terraform init -backend=false -upgrade

      - name: Terraform validate
        run: terraform validate

      - name: Terraform test
        if: matrix.run_tests
        run: terraform test -no-color

      - name: Verify provider argument coverage
        if: matrix.run_tests
        run: scripts/check-provider-arguments.sh

      - name: Validate examples
        run: |
          for example in examples/*; do
            if [ -d "$example" ]; then
              terraform -chdir="$example" init -backend=false -upgrade
              terraform -chdir="$example" validate
            fi
          done
